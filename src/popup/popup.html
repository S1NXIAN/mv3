<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MV3 - HUD</title>
  <link rel="stylesheet" href="../styles/shared.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="crt-overlay"></div>
  <div class="noise-bg"></div>
  <div class="scanner-line"></div>

  <div class="hud-container">
    <div class="hud-frame-top">
      <div class="hud-brand">
        <svg class="target-reticle" viewBox="0 0 100 100">
          <circle cx="50" cy="50" r="40" fill="none" stroke="var(--crimson)" stroke-width="2" stroke-dasharray="10 5" />
          <path d="M 50 0 L 50 20 M 50 80 L 50 100 M 0 50 L 20 50 M 80 50 L 100 50" stroke="var(--crimson)" stroke-width="4" />
        </svg>
        <h1 class="neon-text">MV3 // <span id="title-bridge">BRIDGE</span></h1>
      </div>
      <div class="hud-controls">
        <button id="btn-options" class="hud-btn-icon" title="SYS.CONFIG">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square">
            <polygon points="12 2 22 8.5 22 15.5 12 22 2 15.5 2 8.5 12 2" />
          </svg>
        </button>
      </div>
    </div>

    <div class="hud-panel primary-target">
      <div class="panel-deco-lines"></div>
      <div class="hud-label">
        <span class="glitch-txt" data-text="PRM_TRGT">PRM_TRGT</span> // PAGE_SOURCE
      </div>
      <div class="target-readout">
        <div class="target-data">
          <span class="data-prefix">URL:</span>
          <span id="page-url" class="data-text truncate">---</span>
        </div>
        <button id="btn-send-page" class="hud-action-btn">
          <div class="btn-scan"></div>
          [ OVERRIDE ]
        </button>
      </div>
    </div>

    <div class="hud-panel intercept-grid">
      <div class="hud-label split-label">
        <span>INTERCEPT_SIG</span>
        <span class="hud-badge" id="stream-count">00</span>
      </div>

      <div id="stream-list" class="data-card-container hidden">
      </div>

      <div id="stream-warning-banner" class="marquee-container hidden">
        <div class="marquee-content">
          <span>// WARN: THUMBNAIL FALSE-POSITIVES POSSIBLE // WARN: THUMBNAIL FALSE-POSITIVES POSSIBLE // </span>
          <span>// WARN: THUMBNAIL FALSE-POSITIVES POSSIBLE // WARN: THUMBNAIL FALSE-POSITIVES POSSIBLE // </span>
        </div>
      </div>

      <div id="empty-state" class="hud-empty">
        <div class="radar">
          <div class="radar-sweep"></div>
        </div>
        <div class="status-txt">AWAITING_HLS_SIGNATURES</div>
      </div>
    </div>
  </div>

  <div id="toast-container"></div>
  <script src="../utils/config-defaults.js"></script>
  <script src="popup.js"></script>
</body>
</html>
